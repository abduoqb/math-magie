<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculs Mentaux</title>
    <link rel="icon" type="image/png" href="../images/logo_transparant.png">
    <link rel="stylesheet" href="../style/commun.css" />
    <link rel="stylesheet" href="../style/missions-liste.css" />
    <script src="../js/profils.js"></script>
    <script src="../js/composants/header.js" defer></script>
  </head>
  <body>
    <script>gestionnaireProfils.verifierAccesOuRediriger('../');</script>
    <app-header base-path="../"></app-header>
    <main>
      <section class="entete-missions">
        <h2>Choisis ta mission !</h2>
        <p>Quelle opération souhaites-tu maîtriser aujourd'hui ?</p>
      </section>

      <section class="choix-calculs" id="choix-calculs">
        <article class="carte-mission" data-op="additions">
          <div class="badge-difficulte"></div>
          <a href="additions/additions.html">
            <figure>
              <img src="../images/addition.png" alt="Illustration d'une addition" />
              <figcaption>
                <h3>Additions</h3>
                <span class="btn-lancer">GO !</span>
              </figcaption>
            </figure>
          </a>
        </article>

        <article class="carte-mission" data-op="soustractions">
          <div class="badge-difficulte"></div>
          <a href="soustractions/soustractions.html">
            <figure>
              <img src="../images/soustraction.png" alt="Illustration d'une soustraction" />
              <figcaption>
                <h3>Soustractions</h3>
                <span class="btn-lancer">GO !</span>
              </figcaption>
            </figure>
          </a>
        </article>

        <article class="carte-mission" data-op="multiplications">
          <div class="badge-difficulte"></div>
          <a href="multiplications/multiplications.html">
            <figure>
              <img src="../images/multiplication.png" alt="Illustration d'une multiplication" />
              <figcaption>
                <h3>Multiplications</h3>
                <span class="btn-lancer">GO !</span>
              </figcaption>
            </figure>
          </a>
        </article>

        <article class="carte-mission" data-op="divisions">
          <div class="badge-difficulte"></div>
          <a href="divisions/divisions.html">
            <figure>
              <img src="../images/division.png" alt="Illustration d'une division" />
              <figcaption>
                <h3>Divisions</h3>
                <span class="btn-lancer">GO !</span>
              </figcaption>
            </figure>
          </a>
        </article>
      </section>
    </main>
    <style>
      .carte-mission.inactive { opacity: 0.55; filter: grayscale(1); }
      .carte-mission.inactive a { cursor: not-allowed; pointer-events: none; }
      .carte-mission .consigne-carte { margin: 6px 0 0; font-size: 1rem; color: var(--text-muted); text-align: center; }
    </style>
    <script>
      (function () {
        var gp = (typeof gestionnaireProfils !== 'undefined') ? gestionnaireProfils : null;
        var classe = gp && gp.getNiveauClasse ? gp.getNiveauClasse() : null;
        var prog = (gp && gp.getProgramme && gp.getProgramme()) || (window.PROGRAMMES && (window.PROGRAMMES[classe || 'cm1'] || window.PROGRAMMES.cm1)) || null;
        if (!prog || !prog.calcul) return;
        document.querySelectorAll('.carte-mission[data-op]').forEach(function (carte) {
          var op = carte.getAttribute('data-op');
          var def = prog.calcul[op];
          var titre = carte.querySelector('h3');
          var badge = carte.querySelector('.badge-difficulte');
          var btn = carte.querySelector('.btn-lancer');
          var lien = carte.querySelector('a');
          if (!def || def.actif === false) {
            carte.classList.add('inactive');
            lien.removeAttribute('href');
            lien.setAttribute('aria-disabled', 'true');
            lien.setAttribute('tabindex', '-1');
            if (def && def.libelle) titre.textContent = def.libelle;
            badge.textContent = prog.libelle;
            btn.textContent = 'Pas encore au programme';
            return;
          }
          titre.textContent = def.libelle || titre.textContent;
          var palier = 1;
          try { var pr = gp && gp.getProgression ? gp.getProgression(op) : null; palier = (pr && pr.niveau) || 1; } catch (e) {}
          badge.textContent = 'PALIER ' + palier + '/' + def.niveaux.length;
          if (def.consigne) {
            var p = document.createElement('p');
            p.className = 'consigne-carte';
            p.textContent = def.consigne;
            titre.insertAdjacentElement('afterend', p);
          }
        });
      })();
    </script>
  </body>
</html>
