<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puissance 4 - Mathémagie</title>
    <link rel="icon" type="image/png" href="../../images/logo_transparant.png">
    <link rel="stylesheet" href="../../style/commun.css">
    <link rel="stylesheet" href="../../style/jeux.css">
    <script src="../../js/profils.js"></script>
    <link rel="stylesheet" href="../commun.css">
    <script src="../commun.js"></script>
    <script src="../../js/composants/header.js" defer></script>
</head>

<body class="jeu-page jeu-p4">
    <script>gestionnaireProfils.verifierAccesOuRediriger('../../');</script>
    <app-header base-path="../../"></app-header>
    <main>
      <a href="../index.html" class="lien-retour">← Jeux</a>
      <h2 class="titre"><svg viewBox="0 0 120 120" aria-hidden="true" focusable="false"><rect x="8" y="14" width="104" height="92" rx="14" fill="#2563EB" stroke="#2B2D5B" stroke-width="5"/>
<g stroke="#2B2D5B" stroke-width="3.5">
<circle cx="30" cy="36" r="11" fill="#fff"/><circle cx="60" cy="36" r="11" fill="#fff"/><circle cx="90" cy="36" r="11" fill="#fff"/>
<circle cx="30" cy="62" r="11" fill="#fff"/><circle cx="60" cy="62" r="11" fill="#EF4444"/><circle cx="90" cy="62" r="11" fill="#fff"/>
<circle cx="30" cy="88" r="11" fill="#FACC15"/><circle cx="60" cy="88" r="11" fill="#EF4444"/><circle cx="90" cy="88" r="11" fill="#FACC15"/></g></svg> Puissance 4</h2>
      <div class="presentation">
        <div class="cadre">
          <div class="jeu-conteneur">
            <div id="zone-defi"></div>
            <div class="jeu-parole">
              <img class="jeu-mascotte" src="../../images/mascotte-neutre.svg" data-dossier="../../images/" data-etat="neutre" alt="" width="76" height="76" onerror="this.style.display='none'">
              <p id="tour-info" class="tour-info">Tour de <i class="jeton rouge"></i> Rouge</p>
            </div>
            <div class="col-hover" id="col-hover"></div>
            <div class="grille-p4" id="grille"></div>
            <div class="score-board">
              <div class="score-item score-rouge"><i class="jeton rouge"></i><span id="score-rouge">0</span></div>
              <div class="score-item">Nul <span id="score-nul">0</span></div>
              <div class="score-item score-jaune"><i class="jeton jaune"></i><span id="score-jaune">0</span></div>
            </div>
            <button id="changer" onclick="reinitialiser()">Rejouer</button>
          </div>
        </div>
      </div>
    </main>
    <script>
      const LIGNES = 6, COLS = 7;
      let grille, tourRouge, partieTerminee;
      let scores = { rouge: 0, jaune: 0, nul: 0 };

      const grilleEl = document.getElementById('grille');
      const colHoverEl = document.getElementById('col-hover');
      const tourInfoEl = document.getElementById('tour-info');
      const cadre = document.querySelector('.cadre');

      function nomJoueur(rouge) {
        return rouge ? '<i class="jeton rouge"></i> Rouge' : '<i class="jeton jaune"></i> Jaune';
      }
      function dire(html, cls) {
        tourInfoEl.className = 'tour-info' + (cls ? ' ' + cls : '');
        tourInfoEl.innerHTML = html;
      }

      function init() {
        grille = Array.from({ length: LIGNES }, () => Array(COLS).fill(0));
        tourRouge = true;
        partieTerminee = false;
        cadre.classList.remove('succes', 'erreur');
        dire('Tour de ' + nomJoueur(true));
        JeuxNiveau.mascotte('neutre');
        dessiner();
      }

      function dessiner() {
        grilleEl.innerHTML = '';
        colHoverEl.innerHTML = '';
        for (let c = 0; c < COLS; c++) {
          const ind = document.createElement('div');
          ind.className = 'col-indicateur ' + (tourRouge ? 'rouge' : 'jaune');
          ind.setAttribute('aria-label', 'Jouer dans la colonne ' + (c + 1));
          ind.addEventListener('click', () => tenterColonne(c));
          colHoverEl.appendChild(ind);
        }
        for (let l = 0; l < LIGNES; l++) {
          for (let c = 0; c < COLS; c++) {
            const cell = document.createElement('div');
            cell.className = 'case-p4';
            cell.dataset.ligne = l;
            cell.dataset.col = c;
            cell.addEventListener('click', () => tenterColonne(c));
            if (grille[l][c] === 1) cell.classList.add('rouge');
            if (grille[l][c] === 2) cell.classList.add('jaune');
            grilleEl.appendChild(cell);
          }
        }
      }

      function tenterColonne(col) {
        if (partieTerminee || grille[0][col] !== 0) return;
        JeuxNiveau.demanderCalcul(() => jouerColonne(col));
      }

      function jouerColonne(col) {
        if (partieTerminee) return;
        // Trouver la ligne la plus basse libre
        let ligneCible = -1;
        for (let l = LIGNES - 1; l >= 0; l--) {
          if (grille[l][col] === 0) { ligneCible = l; break; }
        }
        if (ligneCible === -1) return; // Colonne pleine

        const joueur = tourRouge ? 1 : 2;
        grille[ligneCible][col] = joueur;

        dessiner();
        // Animation de chute
        const cell = grilleEl.children[ligneCible * COLS + col];
        cell.classList.add('chute');

        const combo = verifierVictoire(ligneCible, col, joueur);
        if (combo) {
          partieTerminee = true;
          combo.forEach(([l, c]) => {
            grilleEl.children[l * COLS + c].classList.add('gagnante');
          });
          dire(nomJoueur(tourRouge) + ' a gagné ! Bravo !', 'fin-ok');
          JeuxNiveau.mascotte('heureuse');
          cadre.classList.add('succes');
          if (tourRouge) scores.rouge++; else scores.jaune++;
          majScores();
          sauvegarder();
          return;
        }

        // Match nul : si la ligne du haut est pleine, toute la grille est pleine
        if (grille[0].every(v => v !== 0)) {
          partieTerminee = true;
          dire('Match nul ! Bien joué !', 'fin-nul');
          scores.nul++;
          majScores();
          return;
        }

        tourRouge = !tourRouge;
        dire('Tour de ' + nomJoueur(tourRouge));
      }

      function verifierVictoire(l, c, joueur) {
        const directions = [[0,1],[1,0],[1,1],[1,-1]];
        for (const [dl, dc] of directions) {
          const combo = [[l, c]];
          // Sens positif
          for (let i = 1; i < 4; i++) {
            const nl = l + dl * i, nc = c + dc * i;
            if (nl >= 0 && nl < LIGNES && nc >= 0 && nc < COLS && grille[nl][nc] === joueur) {
              combo.push([nl, nc]);
            } else break;
          }
          // Sens négatif
          for (let i = 1; i < 4; i++) {
            const nl = l - dl * i, nc = c - dc * i;
            if (nl >= 0 && nl < LIGNES && nc >= 0 && nc < COLS && grille[nl][nc] === joueur) {
              combo.push([nl, nc]);
            } else break;
          }
          if (combo.length >= 4) return combo;
        }
        return null;
      }

      function reinitialiser() { init(); }

      function majScores() {
        document.getElementById('score-rouge').textContent = scores.rouge;
        document.getElementById('score-jaune').textContent = scores.jaune;
        document.getElementById('score-nul').textContent = scores.nul;
      }

      function sauvegarder() {
        const data = gestionnaireProfils.getProgression('jeu-puissance4') || {};
        gestionnaireProfils.setProgression('jeu-puissance4', {
          partiesJouees: (data.partiesJouees || 0) + 1
        });
      }

      JeuxNiveau.creerBasculeDefi(document.getElementById('zone-defi'));
      const voixP = JeuxNiveau.creerBoutonVoix(() => 'Puissance 4. Aligne quatre jetons pour gagner.');
      if (voixP) document.getElementById('zone-defi').appendChild(voixP);
      init();
    </script>
</body>
</html>
