<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Missions Géométrie - Mathémagie</title>
    <link rel="icon" type="image/png" href="../images/logo_transparant.png" />
    <link rel="stylesheet" href="../style/commun.css" />
    <link rel="stylesheet" href="../style/geometrie.css" />
    <script src="../js/profils.js"></script>
    <script src="../js/composants/header.js" defer></script>
    <script src="js/programme_geo.js"></script>
    <script src="js/icones_geo.js"></script>
  </head>
  <body class="geo-index">
    <script>gestionnaireProfils.verifierAccesOuRediriger('../');</script>
    <app-header base-path="../"></app-header>
    <main>
      <section class="entete-missions geo-hero">
        <img class="geo-hero-img" src="../images/univers-geometrie.svg" alt="" width="128" height="128" onerror="this.style.display='none'" />
        <div class="geo-hero-texte">
          <h2>Académie de Géométrie</h2>
          <p id="sous-titre">Relève les défis pour devenir un Grand Archimage !</p>
        </div>
      </section>

      <section class="choix-calculs geo-grille" id="liste-missions" aria-live="polite"></section>
    </main>
    <script>
      (function () {
        var MISSIONS = [
          { id: 'geometrie-formes', page: 'formes.html', titre: 'Le nom des formes' },
          { id: 'geometrie-proprietes', page: 'proprietes.html', titre: 'Sommets et côtés' },
          { id: 'geometrie-angles', page: 'angles.html', titre: 'Les angles' },
          { id: 'geometrie-symetrie', page: 'symetrie.html', titre: 'Symétrie' },
          { id: 'geometrie-vraifaux', page: 'vrai_faux.html', titre: 'Vrai ou Faux ?' },
          { id: 'geometrie-droites', page: 'droites.html', titre: 'Droites Magiques' },
          { id: 'geometrie-triangles', page: 'triangles.html', titre: 'Le Secret des Triangles' },
          { id: 'geometrie-quadrilateres', page: 'quadrilateres.html', titre: 'Tapis Volants' },
          { id: 'geometrie-patrons', page: 'patrons.html', titre: 'Les Patrons Magiques' },
          { id: 'geometrie-espace', page: 'espace.html', titre: "Repérage dans l'espace" },
          { id: 'geometrie-solides', page: 'solides.html', titre: 'Les Solides' },
          { id: 'geometrie-cercle', page: 'cercle.html', titre: 'Cercle et Compas' },
          { id: 'geometrie-instruments', page: 'instruments.html', titre: 'Règle, équerre, compas' },
          { id: 'geometrie-rapporteur', page: 'rapporteur.html', titre: 'Le Rapporteur' }
        ];
        var CADENAS = '<svg class="geo-cadenas" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="4" y="10" width="16" height="11" rx="3" fill="#94A3B8" stroke="#475569" stroke-width="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="#475569" stroke-width="2.4" stroke-linecap="round"/></svg>';
        var estCP = GeoProgramme.estCP();
        if (estCP) document.body.classList.add('geo-cp');

        function etoilesPour(m, actif) {
          // 1 étoile par palier du moteur ; remplie quand le palier est validé (>= 8/10)
          var max = GeoProgramme.maxNiveau(m.id);
          var niveau = 1;
          try {
            var prog = gestionnaireProfils.getProgression(m.id);
            if (prog && prog.niveau) niveau = prog.niveau;
          } catch (e) {}
          var faites = Math.max(0, Math.min(max, niveau - 1));
          var html = '';
          for (var i = 0; i < max; i++) html += GeoIcones.etoile(i < faites);
          return { html: html, faites: faites, max: max };
        }

        function creerCarte(m, actif) {
          var carte = document.createElement('article');
          carte.className = 'carte-mission geo-carte' + (actif ? '' : ' carte-inactive');
          var lien = document.createElement('a'); // <a> sans href quand inactif
          lien.className = 'geo-carte-lien';
          if (actif) { lien.href = 'missions/' + m.page; }
          else { lien.classList.add('bloc-inactif'); lien.setAttribute('aria-disabled', 'true'); lien.setAttribute('role', 'link'); }
          var fig = document.createElement('div');
          fig.className = 'geo-carte-icone';
          fig.innerHTML = GeoIcones.svg(m.id);
          lien.appendChild(fig);
          var h3 = document.createElement('h3');
          h3.textContent = m.titre;
          lien.appendChild(h3);
          if (actif) {
            var et = etoilesPour(m, actif);
            var rang = document.createElement('div');
            rang.className = 'geo-etoiles';
            rang.setAttribute('role', 'img');
            rang.setAttribute('aria-label', et.faites + ' étoile' + (et.faites > 1 ? 's' : '') + ' sur ' + et.max);
            rang.innerHTML = et.html;
            lien.appendChild(rang);
          }
          var btn = document.createElement('span');
          btn.className = 'btn-lancer geo-cta';
          if (actif) btn.textContent = 'Jouer';
          else btn.innerHTML = CADENAS + '<span>Pas encore au programme</span>';
          lien.appendChild(btn);
          carte.appendChild(lien);
          return carte;
        }

        var liste = document.getElementById('liste-missions');
        // Une mission absente du programme de la classe n'est pas montrée (pas de cadenas inutiles) ;
        // une mission présente mais inactive reste visible sous « Plus tard ».
        var prog = GeoProgramme.programme();
        var connues = MISSIONS.filter(function (m) { return !prog || !prog.geometrie || prog.geometrie[m.id]; });
        var actives = connues.filter(function (m) { return GeoProgramme.actif(m.id); });
        var inactives = connues.filter(function (m) { return !GeoProgramme.actif(m.id); });
        actives.forEach(function (m) { liste.appendChild(creerCarte(m, true)); });
        if (inactives.length) {
          if (actives.length) {
            var sep = document.createElement('p');
            sep.className = 'geo-separateur';
            sep.textContent = 'Plus tard';
            liste.appendChild(sep);
          }
          inactives.forEach(function (m) { liste.appendChild(creerCarte(m, false)); });
        }
        var st = document.getElementById('sous-titre');
        if (st) st.textContent = estCP ? 'Choisis une mission !' : 'Relève les ' + actives.length + ' défis pour devenir un Grand Archimage !';
      })();
    </script>
  </body>
</html>
