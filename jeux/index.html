<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Salle de Jeux - Mathémagie</title>
    <link rel="icon" type="image/png" href="../images/logo_transparant.png" />
    <link rel="stylesheet" href="../style/commun.css" />
    <link rel="stylesheet" href="../style/jeux.css" />
    <script src="../js/profils.js"></script>
    <script src="../js/composants/header.js" defer></script>
  </head>
  <body class="jeu-index">
    <script>gestionnaireProfils.verifierAccesOuRediriger('../');</script>
    <app-header base-path="../"></app-header>
    <main>
      <section class="entete-missions jeu-hero">
        <img class="jeu-hero-img" src="../images/univers-jeux.svg" alt="" width="128" height="128" onerror="this.style.display='none'" />
        <div class="jeu-hero-texte">
          <h2>Salle de Jeux</h2>
          <p>Défie tes amis ou joue seul !</p>
        </div>
      </section>

      <section class="defi-jour" id="defi-jour" aria-label="Défi du jour" hidden></section>

      <div id="jeux-magiques"></div>

      <h3 class="jeu-rubrique-titre" id="titre-classiques">🎲 Les grands classiques</h3>
      <section class="choix-calculs jeu-grille">
        <article class="carte-mission jeu-carte" data-jeu="morpion">
          <a class="jeu-carte-lien" href="morpion/index.html">
            <div class="jeu-carte-image"><svg viewBox="0 0 120 120" aria-hidden="true" focusable="false"><g stroke="#2B2D5B" stroke-width="5" stroke-linecap="round"><line x1="44" y1="14" x2="44" y2="106"/><line x1="76" y1="14" x2="76" y2="106"/><line x1="14" y1="44" x2="106" y2="44"/><line x1="14" y1="76" x2="106" y2="76"/></g>
<g stroke="#1D4ED8" stroke-width="8" stroke-linecap="round"><line x1="18" y1="18" x2="36" y2="36"/><line x1="36" y1="18" x2="18" y2="36"/><line x1="84" y1="84" x2="102" y2="102"/><line x1="102" y1="84" x2="84" y2="102"/><line x1="51" y1="51" x2="69" y2="69"/><line x1="69" y1="51" x2="51" y2="69"/></g>
<g fill="none" stroke="#BE123C" stroke-width="8"><circle cx="60" cy="27" r="9"/><circle cx="27" cy="60" r="9"/><circle cx="93" cy="93" r="9" stroke-opacity="0"/><circle cx="93" cy="60" r="9"/></g></svg></div>
            <div class="jeu-texte">
              <h3>Morpion</h3>
              <span class="jeu-badge"><i></i><i></i> 2 joueurs</span>
            </div>
            <span class="btn-lancer jeu-cta">Jouer</span>
          </a>
        </article>
        <article class="carte-mission jeu-carte" data-jeu="puissance4">
          <a class="jeu-carte-lien" href="puissance4/index.html">
            <div class="jeu-carte-image"><svg viewBox="0 0 120 120" aria-hidden="true" focusable="false"><rect x="8" y="14" width="104" height="92" rx="14" fill="#2563EB" stroke="#2B2D5B" stroke-width="5"/>
<g stroke="#2B2D5B" stroke-width="3.5">
<circle cx="30" cy="36" r="11" fill="#fff"/><circle cx="60" cy="36" r="11" fill="#fff"/><circle cx="90" cy="36" r="11" fill="#fff"/>
<circle cx="30" cy="62" r="11" fill="#fff"/><circle cx="60" cy="62" r="11" fill="#EF4444"/><circle cx="90" cy="62" r="11" fill="#fff"/>
<circle cx="30" cy="88" r="11" fill="#FACC15"/><circle cx="60" cy="88" r="11" fill="#EF4444"/><circle cx="90" cy="88" r="11" fill="#FACC15"/></g></svg></div>
            <div class="jeu-texte">
              <h3>Puissance 4</h3>
              <span class="jeu-badge"><i></i><i></i> 2 joueurs</span>
            </div>
            <span class="btn-lancer jeu-cta">Jouer</span>
          </a>
        </article>
        <article class="carte-mission jeu-carte" data-jeu="pendu">
          <a class="jeu-carte-lien" href="pendu/index.html">
            <div class="jeu-carte-image"><svg viewBox="0 0 120 120" aria-hidden="true" focusable="false"><g stroke="#B45309" stroke-width="7" stroke-linecap="round" fill="none"><line x1="16" y1="68" x2="62" y2="68"/><line x1="30" y1="68" x2="30" y2="8"/><line x1="30" y1="8" x2="62" y2="8"/><line x1="62" y1="8" x2="62" y2="18"/></g>
<circle cx="62" cy="28" r="9" fill="#FDE68A" stroke="#2B2D5B" stroke-width="4"/>
<g stroke="#2B2D5B" stroke-width="4" stroke-linecap="round"><line x1="62" y1="37" x2="62" y2="54"/><line x1="62" y1="43" x2="52" y2="50"/><line x1="62" y1="43" x2="72" y2="50"/></g>
<g stroke="#2B2D5B" stroke-width="3.5"><rect x="14" y="84" width="22" height="26" rx="6" fill="#BBF7D0"/><rect x="49" y="84" width="22" height="26" rx="6" fill="#fff"/><rect x="84" y="84" width="22" height="26" rx="6" fill="#BBF7D0"/></g>
<g font-family="Lexend,sans-serif" font-weight="800" font-size="19" fill="#2B2D5B" text-anchor="middle"><text x="25" y="104">A</text><text x="95" y="104">E</text></g></svg></div>
            <div class="jeu-texte">
              <h3>Le Pendu</h3>
              <span class="jeu-badge"><i></i> Solo</span>
            </div>
            <span class="btn-lancer jeu-cta">Jouer</span>
          </a>
        </article>
        <article class="carte-mission jeu-carte" data-jeu="trouver-le-chiffre">
          <a class="jeu-carte-lien" href="trouver-le-chiffre/index.html">
            <div class="jeu-carte-image"><svg viewBox="0 0 120 120" aria-hidden="true" focusable="false"><rect x="30" y="34" width="60" height="52" rx="14" fill="#FDE68A" stroke="#2B2D5B" stroke-width="5"/>
<text x="60" y="76" font-family="Lexend,sans-serif" font-weight="800" font-size="46" fill="#2B2D5B" text-anchor="middle">?</text>
<polygon points="60,6 80,28 40,28" fill="#EA580C" stroke="#2B2D5B" stroke-width="4" stroke-linejoin="round"/>
<polygon points="60,114 80,92 40,92" fill="#2563EB" stroke="#2B2D5B" stroke-width="4" stroke-linejoin="round"/></svg></div>
            <div class="jeu-texte">
              <h3>Trouver le chiffre</h3>
              <span class="jeu-badge"><i></i> Solo</span>
            </div>
            <span class="btn-lancer jeu-cta">Jouer</span>
          </a>
        </article>
      </section>
    </main>
    <script src="commun.js"></script>
    <script>
      var cp = JeuxNiveau.niveau() === 'cp';

      /* Jeux magiques : une rubrique par catégorie, construite depuis le catalogue (jeux/commun.js) */
      (function () {
        var racine = document.getElementById('jeux-magiques');
        var etat = JeuxNiveau.etatDefi();
        JeuxNiveau.CATEGORIES.forEach(function (cat) {
          var jeux = JeuxNiveau.CATALOGUE.filter(function (j) { return j.categorie === cat.id && JeuxNiveau.jeuActif(j.id); });
          if (!jeux.length) return;
          var titre = document.createElement('h3');
          titre.className = 'jeu-rubrique-titre';
          titre.textContent = cat.titre;
          var grille = document.createElement('section');
          grille.className = 'choix-calculs jeu-grille';
          grille.setAttribute('aria-label', cat.titre);
          jeux.forEach(function (j) {
            var carte = document.createElement('article');
            carte.className = 'carte-mission jeu-carte';
            carte.dataset.jeu = j.id;
            var lien = document.createElement('a');
            lien.className = 'jeu-carte-lien';
            lien.href = j.id + '/index.html';
            var img = document.createElement('div');
            img.className = 'jeu-carte-image';
            var em = document.createElement('span');
            em.className = 'jeu-emoji';
            em.setAttribute('aria-hidden', 'true');
            em.textContent = j.emoji;
            img.appendChild(em);
            var texte = document.createElement('div');
            texte.className = 'jeu-texte';
            var h = document.createElement('h3');
            h.textContent = j.titre;
            var badge = document.createElement('span');
            badge.className = 'jeu-badge';
            badge.innerHTML = '<i></i> Solo';
            texte.appendChild(h);
            texte.appendChild(badge);
            if (!cp) {
              var acc = document.createElement('p');
              acc.className = 'jeu-accroche';
              acc.textContent = j.accroche;
              texte.appendChild(acc);
            }
            if (etat.jeu && etat.jeu.id === j.id) {
              var etiq = document.createElement('span');
              etiq.className = 'jeu-defi-etiquette';
              etiq.textContent = etat.fait ? '✅ Défi du jour fait' : '🔥 Défi du jour';
              texte.appendChild(etiq);
            }
            var cta = document.createElement('span');
            cta.className = 'btn-lancer jeu-cta';
            cta.textContent = 'Jouer';
            lien.appendChild(img);
            lien.appendChild(texte);
            lien.appendChild(cta);
            carte.appendChild(lien);
            grille.appendChild(carte);
          });
          racine.appendChild(titre);
          racine.appendChild(grille);
        });

        /* Bandeau « Défi du jour » */
        var bandeau = document.getElementById('defi-jour');
        if (etat.jeu) {
          bandeau.hidden = false;
          bandeau.className = 'defi-jour' + (etat.fait ? ' fait' : '');
          var emj = document.createElement('span');
          emj.className = 'defi-jour-emoji';
          emj.setAttribute('aria-hidden', 'true');
          emj.textContent = etat.fait ? '✅' : '🔥';
          var corps = document.createElement('div');
          corps.className = 'defi-jour-corps';
          var t = document.createElement('p');
          t.className = 'defi-jour-titre';
          t.textContent = etat.fait ? 'Défi du jour réussi !' : 'Défi du jour';
          var d = document.createElement('p');
          d.className = 'defi-jour-desc';
          d.textContent = etat.fait
            ? 'Reviens demain pour un nouveau défi.'
            : (cp ? etat.jeu.titre : 'Aujourd\u2019hui : ' + etat.jeu.titre + '. ' + etat.jeu.accroche);
          corps.appendChild(t);
          corps.appendChild(d);
          if (etat.serie > 0) {
            var s = document.createElement('p');
            s.className = 'defi-jour-serie';
            s.textContent = '🔥 ' + etat.serie + ' jour' + (etat.serie > 1 ? 's' : '') + ' d\u2019affilée';
            corps.appendChild(s);
          }
          bandeau.appendChild(emj);
          bandeau.appendChild(corps);
          var go = document.createElement('a');
          go.className = 'defi-jour-bouton';
          go.href = etat.jeu.id + '/index.html';
          go.textContent = etat.fait ? 'Rejouer' : 'Relever le défi';
          bandeau.appendChild(go);
        }
      })();

      document.querySelectorAll('[data-jeu]').forEach(function (c) {
        if (!JeuxNiveau.jeuActif(c.dataset.jeu)) c.style.display = 'none';
      });
      if (cp) {
        document.querySelector('.entete-missions p').textContent = 'Choisis un jeu !';
        document.body.classList.add('jeu-cp');
      }
    </script>
  </body>
</html>
