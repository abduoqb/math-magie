<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morpion - Mathémagie</title>
    <link rel="icon" type="image/png" href="../../images/logo_transparant.png">
    <link rel="stylesheet" href="../../style/commun.css">
    <link rel="stylesheet" href="../../style/jeux.css">
    <script src="../../js/profils.js"></script>
    <link rel="stylesheet" href="../commun.css">
    <script src="../commun.js"></script>
    <script src="../../js/composants/header.js" defer></script>
</head>

<body class="jeu-page jeu-morpion">
    <script>gestionnaireProfils.verifierAccesOuRediriger('../../');</script>
    <app-header base-path="../../"></app-header>
    <main>
      <a href="../index.html" class="lien-retour">← Jeux</a>
      <h2 class="titre"><svg viewBox="0 0 120 120" aria-hidden="true" focusable="false"><g stroke="#2B2D5B" stroke-width="5" stroke-linecap="round"><line x1="44" y1="14" x2="44" y2="106"/><line x1="76" y1="14" x2="76" y2="106"/><line x1="14" y1="44" x2="106" y2="44"/><line x1="14" y1="76" x2="106" y2="76"/></g>
<g stroke="#1D4ED8" stroke-width="8" stroke-linecap="round"><line x1="18" y1="18" x2="36" y2="36"/><line x1="36" y1="18" x2="18" y2="36"/><line x1="84" y1="84" x2="102" y2="102"/><line x1="102" y1="84" x2="84" y2="102"/><line x1="51" y1="51" x2="69" y2="69"/><line x1="69" y1="51" x2="51" y2="69"/></g>
<g fill="none" stroke="#BE123C" stroke-width="8"><circle cx="60" cy="27" r="9"/><circle cx="27" cy="60" r="9"/><circle cx="93" cy="93" r="9" stroke-opacity="0"/><circle cx="93" cy="60" r="9"/></g></svg> Morpion</h2>
      <div class="presentation">
        <div class="cadre">
          <div class="jeu-conteneur">
            <div class="mode-selector">
              <button class="mode-btn actif" id="btn-2j" onclick="changerMode(false)">2 joueurs</button>
              <button class="mode-btn" id="btn-ia" onclick="changerMode(true)">Contre l'IA</button>
            </div>
            <div id="zone-defi"></div>
            <div class="jeu-parole">
              <img class="jeu-mascotte" src="../../images/mascotte-neutre.svg" data-dossier="../../images/" data-etat="neutre" alt="" width="76" height="76" onerror="this.style.display='none'">
              <p id="tour-info" class="tour-info">Tour de <span class="symbole x">X</span></p>
            </div>
            <div class="grille-morpion" id="grille"></div>
            <div class="score-board">
              <div class="score-item score-x"><b class="pion x">X</b><span id="score-x">0</span></div>
              <div class="score-item">Nul <span id="score-nul">0</span></div>
              <div class="score-item score-o"><b class="pion o">O</b><span id="score-o">0</span></div>
            </div>
            <button id="changer" onclick="reinitialiser()">Rejouer</button>
          </div>
        </div>
      </div>
    </main>
    <script>
      const plateau = [0, 0, 0, 0, 0, 0, 0, 0, 0];
      let tourX = true;
      let partieTerminee = false;
      let scores = { x: 0, o: 0, nul: 0 };
      let modeIA = false;
      let timerIA = null;

      const grilleEl = document.getElementById('grille');
      const tourInfoEl = document.getElementById('tour-info');
      const cadre = document.querySelector('.cadre');

      const combosGagnantes = [
        [0,1,2], [3,4,5], [6,7,8],
        [0,3,6], [1,4,7], [2,5,8],
        [0,4,8], [2,4,6]
      ];

      function dire(html, cls) {
        tourInfoEl.className = 'tour-info' + (cls ? ' ' + cls : '');
        tourInfoEl.innerHTML = html;
      }

      function changerMode(ia) {
        modeIA = ia;
        document.getElementById('btn-2j').classList.toggle('actif', !ia);
        document.getElementById('btn-ia').classList.toggle('actif', ia);
        scores = { x: 0, o: 0, nul: 0 };
        majScores();
        reinitialiser();
      }

      function creerGrille() {
        grilleEl.innerHTML = '';
        for (let i = 0; i < 9; i++) {
          const btn = document.createElement('button');
          btn.className = 'case-morpion';
          btn.dataset.index = i;
          btn.addEventListener('click', () => {
            // En mode IA, bloquer les clics si c'est le tour de l'IA
            if (modeIA && !tourX) return;
            if (partieTerminee || plateau[i] !== 0) return;
            JeuxNiveau.demanderCalcul(() => jouer(i));
          });
          grilleEl.appendChild(btn);
        }
      }

      function jouer(index) {
        if (partieTerminee || plateau[index] !== 0) return;

        const joueur = tourX ? 1 : 2;
        plateau[index] = joueur;

        const cases = grilleEl.children;
        cases[index].textContent = tourX ? 'X' : 'O';
        cases[index].classList.add('jouee', tourX ? 'x' : 'o');

        const combo = verifierGagnant(joueur);
        if (combo) {
          partieTerminee = true;
          combo.forEach(i => cases[i].classList.add('gagnante'));
          const gagnant = tourX ? 'X' : 'O';
          const perduIA = modeIA && !tourX;
          dire(perduIA
            ? `L'IA a gagné ! On rejoue ?`
            : `<span class="pion ${tourX ? 'x' : 'o'}">${gagnant}</span> a gagné ! Bravo !`, perduIA ? 'fin-ko' : 'fin-ok');
          JeuxNiveau.mascotte(perduIA ? 'pleure' : 'emerveillee');
          cadre.classList.add('succes');
          if (tourX) scores.x++; else scores.o++;
          majScores();
          sauvegarder();
          return;
        }

        if (plateau.every(c => c !== 0)) {
          partieTerminee = true;
          dire('Match nul ! Bien joué !', 'fin-nul');
          JeuxNiveau.mascotte('neutre');
          scores.nul++;
          majScores();
          return;
        }

        tourX = !tourX;
        dire(`Tour de <span class="symbole ${tourX ? 'x' : 'o'}">${tourX ? 'X' : 'O'}</span>`);

        // Tour de l'IA
        if (modeIA && !tourX) {
          dire('<span class="ia-reflexion">L\'IA réfléchit…</span>');
          timerIA = setTimeout(() => {
            timerIA = null;
            if (!modeIA || tourX || partieTerminee) return;
            const coupIA = choisirCoupIA(plateau);
            if (coupIA !== null) jouer(coupIA);
          }, 400);
        }
      }

      function verifierGagnant(joueur) {
        for (const combo of combosGagnantes) {
          if (combo.every(i => plateau[i] === joueur)) return combo;
        }
        return null;
      }

      // Une IA débutante : elle joue surtout au hasard, sans anticiper.
      // Elle ne cherche à gagner ou à bloquer que dans 15 % de ses décisions.
      function choisirCoupIA(etat, hasard = Math.random) {
        const libres = etat.reduce((acc, v, i) => { if (v === 0) acc.push(i); return acc; }, []);
        if (!libres.length || verifierGagnantEtat(etat, 1) || verifierGagnantEtat(etat, 2)) return null;

        const coupGagnant = (joueur) => libres.find((i) => {
          const essai = [...etat];
          essai[i] = joueur;
          return verifierGagnantEtat(essai, joueur);
        });
        // Même une victoire immédiate peut lui échapper : pas de priorité
        // systématique qui punirait chaque erreur de l'enfant.
        if (hasard() < 0.15) {
          const victoire = coupGagnant(2);
          if (victoire !== undefined) return victoire;
          const blocage = coupGagnant(1);
          if (blocage !== undefined) return blocage;
        }
        return libres[Math.floor(hasard() * libres.length)];
      }

      function verifierGagnantEtat(etat, joueur) {
        return combosGagnantes.some(combo => combo.every(i => etat[i] === joueur));
      }

      function reinitialiser() {
        clearTimeout(timerIA);
        timerIA = null;
        plateau.fill(0);
        tourX = true;
        partieTerminee = false;
        cadre.classList.remove('succes', 'erreur');
        dire('Tour de <span class="symbole x">X</span>');
        JeuxNiveau.mascotte('neutre');
        creerGrille();
      }

      function majScores() {
        document.getElementById('score-x').textContent = scores.x;
        document.getElementById('score-o').textContent = scores.o;
        document.getElementById('score-nul').textContent = scores.nul;
      }

      function sauvegarder() {
        const data = gestionnaireProfils.getProgression('jeu-morpion') || {};
        gestionnaireProfils.setProgression('jeu-morpion', {
          partiesJouees: (data.partiesJouees || 0) + 1
        });
      }

      JeuxNiveau.creerBasculeDefi(document.getElementById('zone-defi'));
      const voixM = JeuxNiveau.creerBoutonVoix(() => 'Morpion. Aligne trois signes pour gagner.');
      if (voixM) document.getElementById('zone-defi').appendChild(voixM);
      creerGrille();
    </script>
</body>
</html>
