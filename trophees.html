<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trophées — Mathémagie</title>
    <link rel="icon" type="image/svg+xml" href="images/mascotte-neutre.svg">
    <link rel="stylesheet" href="style/commun.css">
    <script src="js/profils.js"></script>
    <script src="jeux/commun.js"></script>
    <script src="js/composants/header.js" defer></script>
    <style>
        .vitrine-titre { display: flex; align-items: center; justify-content: center; gap: 16px; flex-wrap: wrap; margin: 24px 0 18px; text-align: center; }
        .vitrine-titre img { width: 110px; height: 110px; }
        .vitrine-titre h2 { font-size: 2.3rem; color: var(--encre, #2B2D5B); margin: 0; text-transform: none; }
        .vitrine-titre p { margin: 4px 0 0; font-size: 1.15rem; color: var(--texte, #334155); }

        /* Résumé du mage */
        .stats-globales {
            --c: var(--calcul, #8B5CF6);
            display: grid; grid-template-columns: auto 1fr; gap: 6px 20px; align-items: center;
            background: color-mix(in srgb, var(--c) 18%, #fff);
            color: var(--encre, #2B2D5B);
            border: var(--contour, 3px solid #2B2D5B);
            border-radius: var(--rayon-grand, 32px);
            box-shadow: 0 8px 0 var(--encre, #2B2D5B);
            padding: 20px 24px; margin-bottom: 14px; text-align: left;
        }
        .stats-avatar {
            grid-row: span 3; display: inline-flex; align-items: center; justify-content: center;
            width: 96px; height: 96px; border-radius: 50%; font-size: 3.4rem;
            background: var(--c); border: var(--contour, 3px solid #2B2D5B);
            box-shadow: inset 0 -7px 0 rgba(43, 45, 91, 0.18);
        }
        .stats-globales h3 { color: var(--encre, #2B2D5B); margin: 0; font-size: 1.7rem; overflow-wrap: anywhere; }
        .stats-titre { font-size: 1.05rem; color: var(--texte, #334155); margin: 0; font-weight: 600; }
        .stats-compte { font-family: 'Lexend', sans-serif; font-weight: 800; font-size: 1.15rem; margin: 0; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .barre-trophees { flex: 1; min-width: 140px; height: 18px; background: #fff; border: 3px solid var(--encre, #2B2D5B); border-radius: 12px; overflow: hidden; }
        .barre-trophees span { display: block; height: 100%; background: var(--trophees, #FACC15); }
        .barre-trophees span.pleine { border-right: 3px solid var(--encre, #2B2D5B); }

        /* Sections par univers */
        .trophees-section-titre {
            --u-clair: var(--calcul-clair, #EDE4FF);
            display: inline-flex; align-items: center; gap: 10px;
            font-family: 'Lexend', sans-serif; font-weight: 800; font-size: 1.5rem;
            color: var(--encre, #2B2D5B); background: var(--u-clair);
            border: var(--contour, 3px solid #2B2D5B); border-radius: 999px;
            box-shadow: 0 4px 0 var(--encre, #2B2D5B);
            padding: 6px 22px; margin: 38px 0 6px;
        }
        .trophees-section-titre.geometrie { --u-clair: var(--geometrie-clair, #D5F5F0); }
        .trophees-section-titre.jeux { --u-clair: var(--jeux-clair, #FFE6D2); }
        .trophees-section-titre.speciaux { --u-clair: var(--trophees-clair, #FFF5C2); }

        .trophees-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 24px; margin-top: 18px; }

        .trophee-carte {
            --u-clair: var(--calcul-clair, #EDE4FF);
            position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px;
            background: #fff; padding: 22px 14px 18px; text-align: center;
            border: var(--contour, 3px solid #2B2D5B); border-radius: var(--rayon-grand, 32px);
            box-shadow: 0 6px 0 var(--encre, #2B2D5B);
            transition: transform 0.15s, box-shadow 0.15s; cursor: default;
        }
        .trophee-carte.geometrie { --u-clair: var(--geometrie-clair, #D5F5F0); }
        .trophee-carte.jeux { --u-clair: var(--jeux-clair, #FFE6D2); }
        .trophee-carte.debloque { background: var(--u-clair); }
        .trophee-carte:hover { transform: translateY(-4px); box-shadow: 0 10px 0 var(--encre, #2B2D5B); }
        .trophee-carte.verrouille { background: #EEF0F6; border-style: dashed; box-shadow: 0 6px 0 #9AA0C0; }

        .trophee-icone {
            display: flex; align-items: center; justify-content: center;
            width: 108px; height: 108px; border-radius: 50%; font-size: 3.8rem; line-height: 1;
            background: #fff; border: var(--contour, 3px solid #2B2D5B);
            box-shadow: inset 0 -7px 0 rgba(43, 45, 91, 0.12);
        }
        .trophee-carte.debloque .trophee-icone { background: radial-gradient(circle at 35% 30%, #fff, var(--u-clair)); }
        .trophee-carte.debloque:hover .trophee-icone { animation: saut 0.5s ease; }
        @keyframes saut { 0%,100% { transform: translateY(0); } 40% { transform: translateY(-9px) rotate(-5deg); } }
        /* silhouette: l'emoji est noirci */
        .trophee-carte.verrouille .trophee-icone { background: #D5D9E8; border-color: #6B7199; }
        .trophee-silhouette { filter: brightness(0) opacity(0.38); }
        .trophee-cadenas {
            position: absolute; top: 10px; right: 10px; width: 40px; height: 40px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 1.3rem;
            background: #fff; border: 3px solid #6B7199;
        }

        .trophee-nom { font-family: 'Lexend', sans-serif; font-weight: 800; font-size: 1.12rem; color: var(--encre, #2B2D5B); line-height: 1.2; }
        .trophee-carte.verrouille .trophee-nom { color: #4B5170; }
        .trophee-condition { font-size: 1rem; font-weight: 600; color: var(--texte, #334155); }
        .trophee-carte.verrouille .trophee-condition {
            background: #fff; border: 2px solid #6B7199; border-radius: 14px; padding: 6px 10px; color: #3B4160;
        }
        .trophee-carte.verrouille .trophee-condition::before { content: "👉 "; }
        .trophee-progres { font-family: 'Lexend', sans-serif; font-weight: 800; font-size: 0.95rem; color: #3B4160; }

        /* Médailles colorées */
        .medaille {
            display: inline-flex; align-items: center; gap: 6px; padding: 4px 14px;
            border: 3px solid var(--encre, #2B2D5B); border-radius: 999px;
            font-family: 'Lexend', sans-serif; font-weight: 800; font-size: 1rem; color: var(--encre, #2B2D5B);
            box-shadow: 0 3px 0 var(--encre, #2B2D5B);
        }
        .medaille.bronze { background: #F4B183; }
        .medaille.argent { background: #D7DEE8; }
        .medaille.or { background: #FDE047; }
        .medaille.diamant { background: #A5F3FC; }

        /* Personnages spéciaux */
        .avatars-deblocables-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 20px; margin-top: 18px; }
        .avatar-deb-carte {
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            background: #fff; padding: 16px 12px; text-align: center;
            border: var(--contour, 3px solid #2B2D5B); border-radius: var(--rayon, 22px);
            box-shadow: 0 5px 0 var(--encre, #2B2D5B);
        }
        .avatar-deb-carte.debloque { background: var(--ok-clair, #DCFCE7); }
        .avatar-deb-carte.verrouille { background: #EEF0F6; border-style: dashed; box-shadow: 0 5px 0 #9AA0C0; }
        .avatar-deb-icone { font-size: 3rem; display: block; }
        .avatar-deb-carte.verrouille .avatar-deb-icone { filter: brightness(0) opacity(0.38); }
        .avatar-deb-nom { font-family: 'Lexend', sans-serif; font-weight: 800; font-size: 1rem; color: var(--encre, #2B2D5B); }
        .avatar-deb-condition { font-size: 0.95rem; color: var(--texte, #334155); }
        .avatar-deb-statut { font-size: 0.95rem; font-weight: 800; margin-top: 4px; color: #3B4160; }
        .avatar-deb-carte.debloque .avatar-deb-statut { color: #166534; }

        :is(a, button):focus-visible { outline: 5px solid var(--jeux, #F97316); outline-offset: 3px; }

        @media (max-width: 520px) {
            .vitrine-titre h2 { font-size: 1.8rem; }
            .vitrine-titre img { width: 80px; height: 80px; }
            .stats-globales { grid-template-columns: 1fr; text-align: center; justify-items: center; padding: 16px; }
            .stats-avatar { grid-row: auto; }
            .stats-compte { justify-content: center; width: 100%; }
            .trophees-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
            .trophee-icone { width: 84px; height: 84px; font-size: 3rem; }
            .trophee-carte { padding: 18px 8px 14px; }
            .trophee-nom { font-size: 1rem; }
            .trophees-section-titre { font-size: 1.25rem; padding: 6px 16px; }
            .avatars-deblocables-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
        }
        @media (prefers-reduced-motion: reduce) {
            .trophee-carte, .trophee-carte.debloque:hover .trophee-icone { transition: none; animation: none; }
        }
    </style>
</head>
<body>
    <app-header base-path=""></app-header>
    <main>
        <section class="vitrine-titre">
            <img src="images/univers-trophees.svg" alt="" onerror="this.style.display='none'">
            <div>
                <h2>Mes trophées 🏆</h2>
                <p>Joue pour les gagner tous !</p>
            </div>
        </section>

        <div id="stats-resume" class="stats-globales" role="status" aria-live="polite"></div>

        <div id="trophees-conteneur">
            <!-- Injecté par JS -->
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const esc = (t) => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

            // `action` = phrase courte affichée tant que le trophée est verrouillé
            const missionsCalcul = [
                { id: 'additions', nom: 'Flamme de l\'Addition', action: 'Fais des additions',
                  icones: { 1: '🕯️', 2: '🔥', 4: '☄️', 7: '🌋', 10: '💥' } },
                { id: 'soustractions', nom: 'Givre de la Soustraction', action: 'Fais des soustractions',
                  icones: { 1: '❄️', 2: '🧊', 4: '🌨️', 7: '⛄', 10: '🏔️' } },
                { id: 'multiplications', nom: 'Foudre Multiplicatrice', action: 'Fais des multiplications',
                  icones: { 1: '✨', 2: '⚡', 4: '🌩️', 7: '🔮', 10: '💎' } },
                { id: 'divisions', nom: 'Vague de la Division', action: 'Fais des divisions',
                  icones: { 1: '💧', 2: '🌊', 4: '🐚', 7: '🐋', 10: '🔱' } }
            ];

            const missionsGeometrie = [
                { id: 'geometrie-formes', nom: 'Temple des Formes', action: 'Reconnais des formes',
                  icones: { 1: '🧱', 2: '🏛️', 3: '👑' } },
                { id: 'geometrie-proprietes', nom: 'Laboratoire des Propriétés', action: 'Trouve les propriétés',
                  icones: { 1: '🔍', 2: '🔬', 3: '🧬' } },
                { id: 'geometrie-angles', nom: 'Boussole des Angles', action: 'Joue avec les angles',
                  icones: { 1: '📐', 2: '🧭', 3: '⭐' } },
                { id: 'geometrie-symetrie', nom: 'Papillon de la Symétrie', action: 'Cherche les symétries',
                  icones: { 1: '🪞', 2: '🦋', 3: '🌈' } },
                { id: 'geometrie-vraifaux', nom: 'Oracle de Vérité', action: 'Réponds vrai ou faux',
                  icones: { 1: '❓', 2: '🎯', 3: '🏆' } },
                { id: 'geometrie-droites', nom: 'Lame des Droites', action: 'Observe les droites',
                  icones: { 1: '📏', 2: '🗡️', 3: '⚔️' } },
                { id: 'geometrie-triangles', nom: 'Pyramide des Triangles', action: 'Observe les triangles',
                  icones: { 1: '🔺', 2: '🏔️', 3: '🗻' } },
                { id: 'geometrie-quadrilateres', nom: 'Forteresse des Quadrilatères', action: 'Observe les quadrilatères',
                  icones: { 1: '🧱', 2: '🏰', 3: '🏯' } },
                { id: 'geometrie-patrons', nom: 'Carte des Solides', action: 'Déplie des solides',
                  icones: { 1: '📦', 2: '🗺️', 3: '🌍' } }
            ];

            const statsGlobales = gestionnaireProfils.getStatsProgression();

            const missionsJeux = [
                { id: 'morpion', nom: 'Génie du Morpion',
                  icones: { 5: '❌', 10: '⭕', 20: '👑' },
                  checkProgress: () => statsGlobales._morpionJouees,
                  suffixe: 'parties jouées', action: 'Joue 5 parties de Morpion'
                },
                { id: 'pendu', nom: 'Sauveur de Mots',
                  icones: { 5: '📝', 10: '🔤', 20: '🦸' },
                  checkProgress: () => statsGlobales._penduGagnees,
                  suffixe: 'parties gagnées', action: 'Gagne 5 parties de Pendu'
                },
                { id: 'trouver-le-chiffre', nom: 'Maître Divin',
                  icones: { 5: '🔮', 10: '🧠', 20: '👁️' },
                  checkProgress: () => statsGlobales._chiffreGagnees,
                  suffixe: 'chiffres trouvés', action: 'Trouve 5 chiffres secrets'
                },
                { id: 'puissance4', nom: 'Tacticien Connecté',
                  icones: { 5: '🔴', 10: '🟡', 20: '🏅' },
                  checkProgress: () => statsGlobales._p4Jouees,
                  suffixe: 'parties jouées', action: 'Joue 5 parties de Puissance 4'
                }
            ];
            // Jeux magiques : un trophée par jeu du catalogue (jeux/commun.js)
            if (window.JeuxNiveau) {
                JeuxNiveau.CATALOGUE.forEach((j) => {
                    missionsJeux.push({
                        id: j.id, nom: j.trophee.nom, icones: j.trophee.icones,
                        checkProgress: () => (statsGlobales._parJeu || {})[j.id] || 0,
                        suffixe: 'parties jouées', action: j.trophee.action
                    });
                });
            }

            // Garde d'accès
            gestionnaireProfils.verifierAccesOuRediriger('');

            const conteneur = document.getElementById('trophees-conteneur');
            let debloques = 0;

            // Filtrage par niveau de classe (si getProgramme() disponible, sinon tout afficher)
            const programme = gestionnaireProfils.getProgramme?.() || null;
            const estActif = (m) => m === true || (m && m.actif !== false);
            function filtrer(missions, section, prefixe) {
                if (!section || typeof section !== 'object') return missions;
                const cle = (m) => (m.id in section) ? m.id
                    : (prefixe && m.id.startsWith(prefixe) && m.id.slice(prefixe.length) in section) ? m.id.slice(prefixe.length)
                    : null;
                // Aucune correspondance d'identifiants: on ne peut pas filtrer, comportement actuel
                if (!missions.some(m => cle(m) !== null)) return missions;
                return missions.filter(m => { const k = cle(m); return k !== null && estActif(section[k]); });
            }
            const missionsCalculNiv = programme ? filtrer(missionsCalcul, programme.calcul, '') : missionsCalcul;
            const missionsGeoNiv = programme ? filtrer(missionsGeometrie, programme.geometrie, 'geometrie-') : missionsGeometrie;
            const missionsJeuxNiv = programme ? filtrer(missionsJeux, programme.jeux, '') : missionsJeux;
            const toutesLesMissions = [...missionsCalculNiv, ...missionsGeoNiv, ...missionsJeuxNiv];

            // Paliers par catégorie : géométrie (max 3) et calculs (max 10)
            const paliersCalcul = [
                { seuil: 10, badge: '💎', classe: 'diamant' },
                { seuil: 7, badge: '🥇', classe: 'or' },
                { seuil: 4, badge: '🥈', classe: 'argent' },
                { seuil: 2, badge: '🥉', classe: 'bronze' }
            ];
            const paliersGeometrie = [
                { seuil: 3, badge: '🥇', classe: 'or' },
                { seuil: 2, badge: '🥉', classe: 'bronze' }
            ];
            const paliersJeux = [
                { seuil: 20, badge: '🏆', classe: 'or' },
                { seuil: 10, badge: '🥈', classe: 'argent' },
                { seuil: 5, badge: '🥉', classe: 'bronze' }
            ];

            function getPalier(niv, paliers) {
                for (const p of paliers) {
                    if (niv >= p.seuil) return p;
                }
                return null;
            }

            function getIconeNiveau(icones, niv) {
                let icone = Object.values(icones)[0];
                for (const [seuil, emoji] of Object.entries(icones)) {
                    if (niv >= parseInt(seuil)) icone = emoji;
                }
                return icone;
            }

            function creerSection(titre, missions, paliers, typeSection = 'calcul') {
                const titreSec = document.createElement('h3');
                titreSec.className = 'trophees-section-titre ' + typeSection;
                titreSec.textContent = titre;
                conteneur.appendChild(titreSec);

                const grille = document.createElement('div');
                grille.className = 'trophees-grid';
                grille.setAttribute('role', 'list');
                grille.setAttribute('aria-label', `Trophées ${titre}`);
                conteneur.appendChild(grille);

                missions.forEach(mission => {
                    let nivAffiche = 0;
                    let estDebloque = false;
                    let conditionTexte = '';
                    let progresTexte = '';

                    if (typeSection === 'jeux') {
                        nivAffiche = mission.checkProgress() || 0;
                        estDebloque = nivAffiche >= 5;
                        conditionTexte = estDebloque ? `${nivAffiche} ${mission.suffixe}` : mission.action;
                        if (!estDebloque) progresTexte = `${nivAffiche} / 5`;
                    } else {
                        const data = gestionnaireProfils.getProgression(mission.id);
                        const nivBrut = data?.niveau || 1;
                        nivAffiche = typeSection === 'geometrie' ? Math.max(1, nivBrut - 1) : nivBrut;
                        estDebloque = nivBrut >= 2;
                        conditionTexte = estDebloque ? `Niveau ${nivAffiche}` : mission.action;
                    }
                    const palier = estDebloque ? getPalier(nivAffiche, paliers) : null;

                    if (estDebloque) debloques++;

                    const icone = getIconeNiveau(mission.icones, estDebloque ? nivAffiche : Object.keys(mission.icones)[0]);

                    const carte = document.createElement('div');
                    carte.className = `trophee-carte ${typeSection} ${estDebloque ? 'debloque' : 'verrouille'}`;
                    carte.setAttribute('role', 'listitem');
                    const aria = estDebloque ? `${mission.nom} — ${conditionTexte}${palier ? ' ' + palier.badge : ''}` : `${mission.nom} — verrouillé : ${conditionTexte}`;
                    carte.setAttribute('aria-label', aria);

                    carte.innerHTML = `
                        ${estDebloque ? '' : '<span class="trophee-cadenas" aria-hidden="true">🔒</span>'}
                        <span class="trophee-icone" role="img" aria-hidden="true"><span class="${estDebloque ? '' : 'trophee-silhouette'}">${icone}</span></span>
                        <span class="trophee-nom">${esc(mission.nom)}</span>
                        <span class="trophee-condition">${esc(conditionTexte)}</span>
                        ${palier ? `<span class="medaille ${palier.classe}"><span aria-hidden="true">${palier.badge}</span></span>` : ''}
                        ${progresTexte ? `<span class="trophee-progres">${progresTexte}</span>` : ''}
                    `;
                    grille.appendChild(carte);
                });
            }

            if (missionsCalculNiv.length) creerSection('➕ Calcul', missionsCalculNiv, paliersCalcul, 'calcul');
            if (missionsGeoNiv.length) creerSection('📐 Géométrie', missionsGeoNiv, paliersGeometrie, 'geometrie');
            if (missionsJeuxNiv.length) creerSection('🎲 Jeux', missionsJeuxNiv, paliersJeux, 'jeux');

            // Résumé de progression avec avatar
            const nomMage = gestionnaireProfils.getJoueurActif();
            const avatarMage = gestionnaireProfils.getAvatar();
            const couleurMage = gestionnaireProfils.getCouleur();
            const titreMage = gestionnaireProfils.getTitreMage();
            const niveauClasse = gestionnaireProfils.getNiveauClasse?.() || '';

            const statsResume = document.getElementById('stats-resume');
            if (/^#[0-9a-fA-F]{3,8}$/.test(String(couleurMage))) statsResume.style.setProperty('--c', couleurMage);
            const total = toutesLesMissions.length;
            const pct = total ? Math.round((debloques / total) * 100) : 0;
            statsResume.innerHTML = `
                <div class="stats-avatar" aria-hidden="true">${esc(avatarMage)}</div>
                <h3>${esc(nomMage)}${niveauClasse ? ' · ' + esc(niveauClasse.toUpperCase()) : ''}</h3>
                <p class="stats-titre">${esc(titreMage)}</p>
                <p class="stats-compte"><span>🏆 ${debloques} / ${total}</span><span class="barre-trophees" aria-hidden="true"><span class="${pct >= 100 ? 'pleine' : ''}" style="width: ${pct}%"></span></span></p>
            `;

            // Section personnages spéciaux
            const { debloquesInfos } = gestionnaireProfils.getAvatarsDisponibles();

            const titreAvatars = document.createElement('h3');
            titreAvatars.className = 'trophees-section-titre speciaux';
            titreAvatars.textContent = '⭐ Personnages spéciaux';
            conteneur.appendChild(titreAvatars);

            const grilleAvatars = document.createElement('div');
            grilleAvatars.className = 'avatars-deblocables-grid';
            conteneur.appendChild(grilleAvatars);

            debloquesInfos.forEach(info => {
                const carte = document.createElement('div');
                carte.className = `avatar-deb-carte ${info.debloque ? 'debloque' : 'verrouille'}`;
                carte.innerHTML = `
                    <span class="avatar-deb-icone" aria-hidden="true">${info.emoji}</span>
                    <span class="avatar-deb-nom">${esc(info.nom)}</span>
                    <span class="avatar-deb-condition">${esc(info.condition)}</span>
                    <span class="avatar-deb-statut">
                        ${info.debloque ? '✅ Débloqué !' : '🔒 Verrouillé'}
                    </span>
                `;
                grilleAvatars.appendChild(carte);
            });
        });
    </script>
</body>
</html>
