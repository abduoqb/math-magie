<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accueil — Mathémagie</title>
    <link rel="icon" type="image/svg+xml" href="images/mascotte-neutre.svg" />
    <link rel="stylesheet" href="style/commun.css" />
    <link rel="stylesheet" href="style/accueil.css" />
    <script src="js/profils.js"></script>
    <script src="js/composants/header.js" defer></script>
  </head>
  <body>
    <script>gestionnaireProfils.verifierAccesOuRediriger('');</script>
    <app-header base-path=""></app-header>
    <main>
      <section class="hero-text">
        <img class="mascotte-accueil" id="mascotte-accueil" src="images/mascotte-neutre.svg" alt="" width="120" height="120" onerror="this.style.visibility='hidden'" />
        <div class="hero-bulle">
          <h2 class="titre-anime" id="titre-bienvenue">Salut ! ✨</h2>
          <p id="texte-bienvenue">Choisis ton aventure !</p>
        </div>
        <button type="button" class="btn-lecture" id="btn-lecture" hidden aria-label="Écouter le texte à voix haute">🔊</button>
      </section>

      <section class="activites-grid" aria-label="Les univers">
        <article class="carte-activite carte-calcul" id="carte-calcul">
          <a href="calculs_mentaux/index.html" class="lien-carte">
            <span class="icone-univers" aria-hidden="true">➕</span>
            <div class="image-conteneur">
              <img src="images/univers-calcul.svg" alt="" onerror="this.style.visibility='hidden'" />
            </div>
            <div class="contenu-carte">
              <h3>Calcul</h3>
              <p>Calcule vite !</p>
              <span class="bouton-action">Jouer</span>
            </div>
          </a>
        </article>

        <article class="carte-activite carte-geometrie" id="carte-geometrie">
          <a href="geometrie/index.html" class="lien-carte">
            <span class="icone-univers" aria-hidden="true">📐</span>
            <div class="image-conteneur">
              <img src="images/univers-geometrie.svg" alt="" onerror="this.style.visibility='hidden'" />
            </div>
            <div class="contenu-carte">
              <h3>Formes</h3>
              <p>Découvre les formes !</p>
              <span class="bouton-action">Jouer</span>
            </div>
          </a>
        </article>

        <article class="carte-activite carte-jeux" id="carte-jeux">
          <a href="jeux/index.html" class="lien-carte">
            <span class="icone-univers" aria-hidden="true">🎲</span>
            <div class="image-conteneur">
              <img src="images/univers-jeux.svg" alt="" onerror="this.style.visibility='hidden'" />
            </div>
            <div class="contenu-carte">
              <h3>Jeux</h3>
              <p>Joue et amuse-toi !</p>
              <span class="bouton-action">Jouer</span>
            </div>
          </a>
        </article>
      </section>
    </main>
    <script>
      (function () {
        const gp = window.gestionnaireProfils;
        const prenom = gp?.getJoueurActif?.();
        const niveau = gp?.getNiveauClasse?.() || null;
        const programme = gp?.getProgramme?.() || null;
        const estCP = niveau === 'cp';
        const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

        // Bienvenue personnalisée
        const titre = document.getElementById('titre-bienvenue');
        const texte = document.getElementById('texte-bienvenue');
        if (prenom) {
          titre.innerHTML = 'Bonjour ' + esc(prenom) + ' ! ✨';
          if (!estCP) texte.textContent = "Prêt pour l'aventure ? Choisis ton univers !";
        }

        // Cartes sans mission active pour ce niveau: grisées
        const actifs = (obj) => !obj || (typeof obj === 'object' && Object.keys(obj).length === 0)
          ? null
          : Object.values(obj).some((m) => m === true || (m && m.actif !== false));
        const sections = {
          'carte-calcul': programme ? actifs(programme.calcul) : null,
          'carte-geometrie': programme ? actifs(programme.geometrie) : null,
          'carte-jeux': programme ? actifs(programme.jeux) : null
        };
        for (const [id, actif] of Object.entries(sections)) {
          if (actif !== false) continue; // null (inconnu) ou true => inchangé
          const carte = document.getElementById(id);
          carte.classList.add('indisponible');
          const lien = carte.querySelector('.lien-carte');
          lien.setAttribute('aria-disabled', 'true');
          lien.setAttribute('tabindex', '-1');
          lien.removeAttribute('href');
          lien.addEventListener('click', (e) => e.preventDefault());
          const btn = carte.querySelector('.bouton-action');
          if (btn) btn.textContent = 'Bientôt';
        }

        // Mode CP: icônes d'abord, texte minimal + lecture à voix haute
        if (estCP) {
          document.body.classList.add('niveau-cp');
          texte.textContent = 'Choisis ton aventure !';
          const btnLecture = document.getElementById('btn-lecture');
          if ('speechSynthesis' in window && window.SpeechSynthesisUtterance) {
            btnLecture.hidden = false;
            btnLecture.addEventListener('click', () => {
              const phrases = [titre.textContent, texte.textContent];
              document.querySelectorAll('.carte-activite:not(.indisponible)').forEach((c) => {
                phrases.push(c.querySelector('h3').textContent + '. ' + c.querySelector('.contenu-carte p').textContent);
              });
              window.speechSynthesis.cancel();
              const u = new SpeechSynthesisUtterance(phrases.join(' '));
              u.lang = 'fr-FR';
              u.rate = 0.85;
              window.speechSynthesis.speak(u);
            });
          }
        }
      })();
    </script>
  </body>
</html>
